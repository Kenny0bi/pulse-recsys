[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-recsys"
version = "0.1.0"
description = "A recommender on 25M real ratings: temporal split, two-tower with the logQ correction that took it from losing to a popularity counter to beating every baseline, served through this series' own HNSW"
authors = [{ name = "Kenny Obidele" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "duckdb"]

[tool.setuptools]
packages = ["pulse"]
