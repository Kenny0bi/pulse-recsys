<line x1="815" y1="340" x2="815" y2="274" stroke="#fb7185" stroke-width="25"/>
<line x1="855" y1="340" x2="855" y2="280" stroke="#fb7185" stroke-width="25"/>
<line x1="896" y1="340" x2="896" y2="147" stroke="#fb7185" stroke-width="25"/>
<line x1="937" y1="340" x2="937" y2="133" stroke="#fb7185" stroke-width="25"/>
<text x="937" y="360" fill="#94849e" font-size="10" text-anchor="middle">2016</text>
<line x1="978" y1="340" x2="978" y2="141" stroke="#fb7185" stroke-width="25"/>
<line x1="1019" y1="340" x2="1019" y2="183" stroke="#392c40" stroke-width="25"/>
<line x1="1060" y1="340" x2="1060" y2="197" stroke="#392c40" stroke-width="25"/>
<line x1="998" y1="70" x2="998" y2="348" stroke="#facc15" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="986" y="90" fill="#facc15" font-size="11.5" text-anchor="end">the cutoff: Dec 31, 2017</text>
<text x="986" y="108" fill="#94849e" font-size="10.5" text-anchor="end">train on the past, test on the future</text>
<text x="100" y="420" fill="#94849e" font-size="10.5" font-family="Georgia, serif" font-style="italic">a random split would let the model peek across this line; item and user eligibility are decided from the rose side only</text>
</svg>