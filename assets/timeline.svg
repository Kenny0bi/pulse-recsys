<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 460" font-family="Menlo, Consolas, monospace">
<rect width="1160" height="460" fill="#171019" rx="14"/>
<text x="46" y="52" fill="#efe8f4" font-size="21" font-weight="bold">the river of ratings, and where it was cut</text>
<text x="46" y="74" fill="#94849e" font-size="12.5" font-family="Georgia, serif" font-style="italic">positive ratings (4 stars and up) per year; everything after the cutoff is the future, and the models never see it</text>
<line x1="120" y1="340" x2="120" y2="171" stroke="#fb7185" stroke-width="25"/>
<text x="120" y="360" fill="#94849e" font-size="10" text-anchor="middle">1996</text>
<line x1="161" y1="340" x2="161" y2="262" stroke="#fb7185" stroke-width="25"/>
<line x1="202" y1="340" x2="202" y2="304" stroke="#fb7185" stroke-width="25"/>
<line x1="243" y1="340" x2="243" y2="189" stroke="#fb7185" stroke-width="25"/>
<line x1="284" y1="340" x2="284" y2="100" stroke="#fb7185" stroke-width="25"/>
<text x="284" y="360" fill="#94849e" font-size="10" text-anchor="middle">2000</text>
<line x1="325" y1="340" x2="325" y2="198" stroke="#fb7185" stroke-width="25"/>
<line x1="365" y1="340" x2="365" y2="239" stroke="#fb7185" stroke-width="25"/>
<line x1="406" y1="340" x2="406" y2="233" stroke="#fb7185" stroke-width="25"/>
<line x1="447" y1="340" x2="447" y2="229" stroke="#fb7185" stroke-width="25"/>
