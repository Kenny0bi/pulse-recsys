<line x1="529" y1="340" x2="529" y2="227" stroke="#fb7185" stroke-width="25"/>
<line x1="570" y1="340" x2="570" y2="238" stroke="#fb7185" stroke-width="25"/>
<line x1="610" y1="340" x2="610" y2="222" stroke="#fb7185" stroke-width="25"/>
<text x="610" y="360" fill="#94849e" font-size="10" text-anchor="middle">2008</text>
<line x1="651" y1="340" x2="651" y2="249" stroke="#fb7185" stroke-width="25"/>
<line x1="692" y1="340" x2="692" y2="249" stroke="#fb7185" stroke-width="25"/>
<line x1="733" y1="340" x2="733" y2="261" stroke="#fb7185" stroke-width="25"/>
<line x1="774" y1="340" x2="774" y2="261" stroke="#fb7185" stroke-width="25"/>
